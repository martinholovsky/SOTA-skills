<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Measured lift with the library vs without, on two model generations. Completeness: claude-sonnet-4.6 0.59 to 0.98, lift +0.39, claude-sonnet-5 0.62 to 1.00, lift +0.38; Freshness: claude-sonnet-4.6 · set authored Jul 2026 0.44 to 0.97, lift +0.53, claude-sonnet-5 · same, now-aged set 0.69 to 0.99, lift +0.30, claude-sonnet-5 · set re-authored Aug 2026 0.33 to 1.00, lift +0.67; Routing: claude-sonnet-4.6 0.90 to 1.00, lift +0.10, claude-sonnet-5 0.87 to 0.99, lift +0.13; Defects avoided: claude-sonnet-4.6 0.81 to 1.00, lift +0.19, claude-sonnet-5 1.00 to 1.00, lift +0.00. Completeness and routing hold across the model generation; defect-avoidance expires; freshness falls only because its question set ages, and a re-authored set restores the lift to +0.67.">
<rect x="0.5" y="0.5" width="819" height="555" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="40" font-size="19" font-weight="700" fill="#e6edf3">Does the library change the output — and is that still true?</text>
<text x="24" y="62" font-size="12" fill="#8b949e">Grey = the model alone. Green = what loading the library adds. Every row dated to the model — and, for freshness, to when its questions were written.</text>
