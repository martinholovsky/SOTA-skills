name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every `run:` gets -euo pipefail; without this a step gets `bash -e {0}`
# (no pipefail, no -u) and a failing producer in a pipe passes silently.
defaults:
  run:
    shell: bash

jobs:
  invariants:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0, pinned by commit SHA (sota-devsecops).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # The build steps run repo scripts and never push.
          persist-credentials: false
          # Invariant 5 compares VERSION against the newest v* tag; a shallow
          # tagless checkout would silently skip that comparison.
          fetch-depth: 0
          fetch-tags: true
      - name: Require denylist secret on trusted runs
        # check 3 silently degrades to generic-only if SOTA_DENYLIST is absent.
        # That fallback is correct for fork PRs (which don't receive secrets)
        # but on push-to-main and same-repo PRs a missing secret means the
        # authoritative scan isn't running — fail loudly instead (2026-07-10
        # audit S-MED-1).
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOTA_DENYLIST: ${{ secrets.SOTA_DENYLIST }}
        run: |
          if [ -z "${SOTA_DENYLIST}" ]; then
            echo "::error::SOTA_DENYLIST secret is empty on a trusted run — check 3 would degrade to generic-only. Restore the secret."
            exit 1
          fi
      - name: Check invariants
        # SOTA_DENYLIST (repository secret) carries the private internal-name
        # patterns for check 3; fork PRs don't receive it and fall back to the
        # generic checks — the authoritative scan runs on maintainer branches
        # and on push to main.
        env:
          SOTA_DENYLIST: ${{ secrets.SOTA_DENYLIST }}
        run: ./scripts/check-invariants.sh
      - name: Eval scoring tests
        # The scoring functions produce every number this project publishes. A
        # mutation probe on 2026-07-21 replaced score() with `return 1.0` and NOTHING
        # noticed — no test suite existed and CI never touched evals/. These golden
        # tests are mutation-resistant (each scorer checked at 1.0, 0.0 and a partial)
        # and were watched to fail against that exact mutation before being trusted.
        run: python3 evals/test_scoring.py
      - name: Dead-path fixture + scorer selfcheck
        # The fixture measures a PROCEDURE (mutate the control, delete the dep, run
        # the build), so it is only worth anything while its planted properties still
        # hold. selfcheck.sh re-derives all six by mutation against the real suite;
        # --selftest proves the scorer still separates a report that reasoned from one
        # that ran. A fixture that quietly loses its traps keeps printing plausible
        # scores while measuring nothing — the class it exists to detect.
        run: |
          bash evals/cases/dead-path/selfcheck.sh
          python3 evals/run-dead-path.py --selftest
          python3 evals/run-reimplement.py --selftest

  negative-controls:
    name: Negative controls (the gate can fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          # The harness creates a git worktree and runs the full gate inside it,
          # so it needs the same history/tags the invariants job needs — otherwise
          # the POSITIVE control (clean copy must pass) fails for an unrelated
          # reason and the run aborts with no results.
          fetch-depth: 0
          fetch-tags: true
      - name: Prove check-invariants.sh and verify-setup.sh still reject known-bad input
        # The invariants job proves the gate PASSES on a good tree. Nothing proved
        # it can still FAIL — and "ok" from a working check is byte-identical to
        # "ok" from one whose pathspec drifted. This job injects a known-bad and
        # requires the INTENDED check to be the one that complains; a non-zero exit
        # for any other reason is reported as a FALSE PASS. Two subjects: part A
        # mutates a good tree in a worktree, part B builds a fully-configured fake
        # machine for verify-setup.sh and removes one thing per probe.
        # sota-code-security rules/12 §1/§2.2 + sota-devsecops rules/05 §5.6.
        # Not in pre-commit: it runs the full gate once per mutation (~1 min).
        env:
          SOTA_DENYLIST: ${{ secrets.SOTA_DENYLIST }}
        run: ./scripts/check-negative-controls.sh

  shellcheck:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: known-good/known-bad references (selftests)
        # These two carry the repo's only known-bad/known-good reference PAIRS and were
        # invoked by nothing (found 2026-08-16) — a control that never executes.
        run: |
          python3 evals/run-build-safe.py --selftest
          python3 evals/cases/unscoped-audit/selfcheck.py

      - name: shellcheck scripts/ and tracked *.sh
        # shellcheck is preinstalled on ubuntu-latest runners.
        # -S style, NOT -S warning: SC2086 (unquoted expansion) is info-level, so
        # `-S warning` exits 0 on `rm -rf $dir` — the very class this repo's
        # sota-shell-scripting rules/01 §3 calls "a bug, not style" (found 2026-08-16,
        # reproduced: a file with rm -rf $d/build passes at warning, 2 hits at style).
        # Scope is every tracked .sh, not just scripts/ — evals/cases/dead-path/
        # selfcheck.sh is executed by CI and was linted by nothing.
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh')
          [ -n "$files" ] || { echo "no shell files matched — pathspec drift"; exit 1; }
          echo "$files" | tr ' ' '\n' | sed 's/^/  /'
          # shellcheck disable=SC2086  # word splitting is intended: a file list
          shellcheck -S style $files

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Full history so gitleaks scans every commit, not just the checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          VERSION=8.30.0
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          SHA256=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -fsSL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan (full git history) + assert the scan's scope
        # gitleaks PRINTS its denominator ("179 commits scanned") and nothing ever
        # read it. Measured 2026-08-02: in a --depth 1 clone of this repo it scans
        # 1 of 179 commits, prints "no leaks found", and exits 0 — a green secret
        # scan over 0.5% of history. `fetch-depth: 0` above is the only thing
        # preventing that, and a gate whose correctness rests on a setting nobody
        # asserts is `sota-code-security` rules/11 §2.2.
        #
        # The scope is asserted from the SHALLOW FLAG, not from a commit count.
        # Counts cannot do it: `git rev-list --count HEAD` truncates to 1 in the
        # same clone, so it degrades alongside the scan it would be checking. The
        # three numbers do not agree either (measured here: rev-list HEAD 175,
        # rev-list --all 181, gitleaks 179 — gitleaks walks refs beyond HEAD), so
        # any equality test would be flaky, and a flaky gate gets disabled.
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Shallow checkout — gitleaks cannot scan full history. Restore fetch-depth: 0."
            exit 1
          fi
          # Log outside the worktree: a file written into the repo root would be
          # committable by accident and in scope for the next scan.
          LOG="${RUNNER_TEMP:-/tmp}/gitleaks.log"
          gitleaks git --config .gitleaks.toml --redact --verbose . 2>&1 | tee "$LOG"
          scanned=$(grep -oE '[0-9]+ commits scanned' "$LOG" | grep -oE '^[0-9]+' || true)
          if [ -z "$scanned" ]; then
            echo "::error::gitleaks printed no 'N commits scanned' line — output format changed, so the scope is no longer verified."
            exit 1
          fi
          if [ "$scanned" -lt 2 ]; then
            echo "::error::gitleaks scanned only ${scanned} commit(s) on a non-shallow checkout."
            exit 1
          fi
          echo "gitleaks scope OK: ${scanned} commits scanned, non-shallow checkout."
