apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sa-token-read
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - /var/run/secrets/kubernetes.io/serviceaccount/
