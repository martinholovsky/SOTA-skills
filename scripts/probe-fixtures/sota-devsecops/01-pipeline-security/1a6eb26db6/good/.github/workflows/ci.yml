name: ci
on: push
permissions: {}
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        if: ${{ github.ref == 'refs/heads/main' }}
        run: ./deploy.sh
      - name: chomped
        if: |-
          ${{ github.ref == 'refs/heads/main' }}
        run: ./deploy.sh
      - name: bare expression in a block
        if: >
          github.ref == 'refs/heads/main'
        run: ./deploy.sh
