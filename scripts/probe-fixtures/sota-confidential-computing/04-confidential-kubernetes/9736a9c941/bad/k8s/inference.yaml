apiVersion: v1
kind: Pod
metadata:
  name: inference
  namespace: confidential
spec:
  runtimeClassName: kata-qemu-snp
  containers:
    - name: model
      image: registry.example.com/model:7
      volumeMounts:
        - name: weights
          mountPath: /models
  volumes:
    - name: weights
      hostPath:
        path: /srv/models
