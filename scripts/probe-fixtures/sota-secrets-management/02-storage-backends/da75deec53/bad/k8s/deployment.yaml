apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          image: registry.example.com/api:4
          volumeMounts:
            - name: creds
              mountPath: /run/secrets
      volumes:
        - name: creds
          hostPath:
            path: /var/lib/secrets
